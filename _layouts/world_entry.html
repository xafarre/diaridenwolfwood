---
layout: default
---

<article class="prose world-entry">
  <p class="eyebrow">{{ page.type | default: "World entry" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.image %}<img class="hero" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}
  {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  {{ content }}
</article>
