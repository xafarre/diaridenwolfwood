  Hard-packed dusty ground in an arid region. Behind the group, show an organized but temporary military camp with rows of pale canvas tents, low corrugated-iron barracks, timber utility poles, stacked crates, water tanks, one modest watch platform and several period steam lorries or tractors with riveted boilers and broad wheels. A few uniformed camp personnel and other recruits move with specific tasks—directing arrivals, carrying crates, checking a steam vehicle—without forming a crowd around the protagonists.

  No modern truck, jeep, tank, helicopter, asphalt, concrete runway, contemporary weapon or twentieth-century camouflage. Military organization is communicated through layout, supply activity and command presence, not battle action. The long steam train continues into the background along the left side, releasing pale steam and a restrained column of darker smoke.

