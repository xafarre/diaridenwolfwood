---
layout: default
---

{% if page.status == "published" %}
  <article class="prose">
    <p class="eyebrow">{{ page.label | default: "Act" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
    {{ content }}
  </article>
{% else %}
  <article class="prose"><h1>Not published</h1></article>
{% endif %}
