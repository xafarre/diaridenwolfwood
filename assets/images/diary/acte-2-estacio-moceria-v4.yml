prompt: |-
  Use case: historical-scene. Fresh generation for a project-bound diary illustration, landscape 3:2. Do not edit or reproduce the geometry of either reference. Image 1 fixes only the desired monumental continental-station character, post-industrial steampunk vocabulary, reddish brick, black iron, aged glass, arid industrial context and overall scale. Image 2 fixes only the unstaged documentary 35 mm photographic response, tactile materials, restrained colour and natural exposure. Build a completely new composition with rigorously planned perspective and platforms.

  Narrative moment: Moceria's main steam railway station immediately before the Suelex-bound departure. Released adult recruits in pale prison gowns are being led along one platform toward their long train while railway crews prepare locomotives and couplings.

  Camera and projection: use a centered axial architectural composition rather than an oblique rail-yard view. The camera is centered exactly over the station's longitudinal railway axis, approximately six storeys high, looking downward at about 28 degrees with a shift lens that keeps every architectural vertical perfectly vertical. Place one explicit railway vanishing point on the central vertical axis, in the darkness beneath the station's central clock. Every rail, sleeper row, platform edge, train roofline and canopy edge that recedes into depth must converge geometrically toward that same single vanishing point. The façade plane is perpendicular to the tracks, so its major cornices and roof spring lines remain horizontal. Use a balanced near-symmetrical frame with the monumental station across the upper half and the track fan extending straight toward the lower edge.

  Platform and track plan, exact and countable from left to right: TRACK 1; ISLAND PLATFORM A; TRACK 2; a narrow ballast separation; TRACK 3; ISLAND PLATFORM B; TRACK 4; a narrow ballast separation; TRACK 5; ISLAND PLATFORM C; TRACK 6. Exactly six straight tracks and exactly three long island platforms. Each track has exactly two continuous steel rails at constant gauge. Each platform is a simple rectangular slab in plan: equal width from near end to far end, straight parallel retaining edges, level paved top, squared near end extending beyond the lower crop, and far end continuing under the train sheds. In the photograph the platforms become regular symmetrical trapezoids only because of perspective; they must never bulge, bend, fork, merge, narrow irregularly or drift sideways. No rail may enter, cross or emerge from a platform.

  Railway geometry: all six world-space track centerlines are perfectly straight, parallel and coplanar from the foreground through their assigned station openings. Their paired rails converge optically toward the single central vanishing point while retaining constant real gauge. Sleepers are perpendicular to each track, evenly spaced in world space and progressively compressed with distance. Use continuous ballast shoulders and no switches, points, frogs, crossings, turnouts or extra rail fragments anywhere in the visible foreground or middle ground. Train wheels sit centered on their paired rails.

  Station architecture: a monumental original late-nineteenth-century terminal with the civic grandeur of Amsterdam Centraal and the sweeping train-hall scale of Barcelona's Estació de França, without copying either. Use a richly articulated red-brick-and-pale-stone headhouse centered on a large mechanical clock, substantial corner pavilions and two immense adjacent barrel-vaulted iron-and-glass train sheds. Their structure aligns precisely with the six track axes, three tracks beneath each vault. Integrate practical steampunk steam pipes, pressure conduits, valves and service gantries with restrained weathered copper. The architecture must dwarf adults and locomotives.

  Trains and action: place the long Suelex-bound train on TRACK 3, fully straight and centered. A substantial black steam locomotive is nearer the foreground, followed by refined dark passenger carriages continuing deep under the left train shed; around the middle of the visible consist include one plainer riveted sheet-metal clinical carriage. The train continues beyond the lower frame and deep into the station so it never reads as only three cars. Recruits in pale gowns walk in loose supervised groups on ISLAND PLATFORM B beside it, never on ballast or rails. Place one subordinate steam train on TRACK 1 and another on TRACK 6, both straight and correctly centered. Workers and luggage trolleys remain on platforms only.

  Atmosphere and rendering: dry pale morning in an arid industrial city; dusty stone, no rain and no wet reflections. Dense factories, warehouses, chimneys and pale barren hills beyond the station. White steam remains low and translucent around locomotives; darker smoke rises in a few broad columns through roof vents without covering rails, platform edges or the vanishing point. Reddish brick, pale worn stone, grey riveted steel, black iron, aged glass, worn wood and selective weathered copper. Unstaged full-colour documentary photography captured directly on fine-grain 35 mm negative film, coherent available daylight, believable distant adults, modest dynamic range, gentle highlight roll-off, slight optical softness, restrained colour and clean low-amplitude grain.

  Critical exclusions: no oblique or diagonal track layout, no multiple railway vanishing points, no fisheye or wide-angle barrel distortion, no Dutch angle, no converging verticals, no curved rail, no wavy line, no S-curve, no kink, no changing gauge, no third or orphan rail, no switchwork, no impossible crossing, no rail through a platform, no malformed platform, no triangular platform, no platform fork, no platform of changing width, no people walking on rails, no train straddling two tracks, no bent consist, no duplicated locomotive, no modest depot, no generic rail yard, no modern train, no diesel, no generic science fiction, no fantasy castle, no wet ground, no wall of smoke, no micro-specular glitter, no HDR, no bokeh, no coarse grain, no legible signage, no text and no watermark.
