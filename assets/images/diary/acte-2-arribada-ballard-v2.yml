  Hard pale late-afternoon desert light entering from the camp side, making the opened doorway behind Nicholas comparatively dark. Dry suspended dust catches the light near the ground. Warm ochre earth, faded canvas, charcoal train, grey steel and restrained copper details. Preserve readable midtones in dark clothing and chitin. The emotional temperature is abrupt institutional arrival: exposed after the enclosed journey, ordered into an unknown camp.

